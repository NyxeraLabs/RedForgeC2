services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${REDFORGE_DB_USER:-redforge}
      POSTGRES_PASSWORD: ${REDFORGE_DB_PASS:?set REDFORGE_DB_PASS}
      POSTGRES_DB: ${REDFORGE_DB_NAME:-redforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  teamserver:
    build:
      context: .
      dockerfile: ./docker/teamserver/Dockerfile
    environment:
      REDFORGE_PORT: "${REDFORGE_PORT:-9080}"
      REDFORGE_JWT_SECRET: ${REDFORGE_JWT_SECRET:?set REDFORGE_JWT_SECRET}
      REDFORGE_ADMIN_USER: "${REDFORGE_ADMIN_USER:-admin}"
      REDFORGE_ADMIN_PASS: ${REDFORGE_ADMIN_PASS:?set REDFORGE_ADMIN_PASS}
      REDFORGE_ADMIN_RESET: "${REDFORGE_ADMIN_RESET:-0}"
      REDFORGE_TOKEN_EXPIRY_MIN: "${REDFORGE_TOKEN_EXPIRY_MIN:-60}"
      DATABASE_URL: "postgres://${REDFORGE_DB_USER:-redforge}:${REDFORGE_DB_PASS:?set REDFORGE_DB_PASS}@postgres:5432/${REDFORGE_DB_NAME:-redforge}?sslmode=disable"
      REDFORGE_TLS_CERT_FILE: "/certs/server.crt"
      REDFORGE_TLS_KEY_FILE: "/certs/server.key"
      REDFORGE_CORS_ORIGINS: "https://localhost:5174,https://localhost:5173,https://127.0.0.1:5174,https://127.0.0.1:5173"
    depends_on:
      - postgres
    ports:
      - "${REDFORGE_PORT:-9080}:${REDFORGE_PORT:-9080}"
    volumes:
      - ./docker/certs:/certs:ro

  ui:
    build:
      context: .
      dockerfile: ./docker/ui/Dockerfile
      args:
        VITE_BUILD_SHA: "${REDFORGE_BUILD_SHA:-dev}"
        VITE_BUILD_EPOCH: "${REDFORGE_BUILD_EPOCH:-0}"
        VITE_TEAMSERVER_URL: "${REDFORGE_UI_TEAMSERVER_URL:-https://localhost:9080}"
    ports:
      - "5174:5173"
    volumes:
      - ./docker/certs:/certs:ro

volumes:
  postgres_data:
