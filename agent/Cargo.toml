[package]
name = "redforge_agent"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
zeroize = "1.5"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1.31", features = ["rt-multi-thread", "macros", "time", "process"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
rand = "0.8"
hostname = "0.4"
sysinfo = "0.35"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
whoami = "1.3"
base64 = "0.21"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
tempfile = "3.8"
